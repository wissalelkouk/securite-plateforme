apiVersion: v1
kind: Namespace
metadata:
  name: tp17
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tp17
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
      - name: api
        image: traefik/whoami:latest
        args: ["--port", "8080"]
        ports: [{ containerPort: 8080 }]
        securityContext:
          privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tp17
spec:
  selector: { app: api }
  ports:
  - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tp17
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
      - name: frontend
        image: nginx:latest
        ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tp17
spec:
  selector: { app: frontend }
  ports:
  - { port: 80, targetPort: 80 }
---
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: tp17
  labels: { app: intruder }
spec:
  containers:
  - name: intruder
    image: busybox:1.36
    command: ["sleep", "86400"]
