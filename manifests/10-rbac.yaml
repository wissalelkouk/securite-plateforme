apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: tp17
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: tp17
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-sa-configmap-reader
  namespace: tp17
subjects:
- kind: ServiceAccount
  name: api-sa
  namespace: tp17
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io
