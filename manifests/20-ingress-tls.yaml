# TP16 partie 2 : Ingress HTTPS. L'annotation demande à cert-manager de créer le certificat.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: tp16
  annotations:
    cert-manager.io/cluster-issuer: lab-ca-issuer
    # TODO : rediriger HTTP vers HTTPS (Traefik : entrypoint websecure uniquement,
    #        traefik.ingress.kubernetes.io/router.entrypoints: websecure)
spec:
  ingressClassName: traefik
  # TODO : bloc tls avec l'hôte whoami.lab.local et secretName: whoami-tls
  rules:
    - host: whoami.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami # remplacé par oauth2-proxy en partie 5
                port: { name: http }
