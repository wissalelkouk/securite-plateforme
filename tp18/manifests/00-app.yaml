apiVersion: v1
kind: Namespace
metadata:
  name: tp18
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: tp18
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-reader
  namespace: tp18
spec:
  replicas: 1
  selector:
    matchLabels: { app: secret-reader }
  template:
    metadata:
      labels: { app: secret-reader }
    spec:
      serviceAccountName: app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: reader
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - 'while true; do echo "$(date +%T) env=$API_KEY file=$(cat /etc/secret/api-key)"; sleep 10; done'
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials
              key: api-key
        volumeMounts:
        - { name: secret-vol, mountPath: /etc/secret, readOnly: true }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 10m, memory: 8Mi }
          limits:   { cpu: 50m, memory: 32Mi }
      volumes:
      - name: secret-vol
        secret:
          secretName: api-credentials
