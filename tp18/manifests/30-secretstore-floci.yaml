apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: floci-sm
  namespace: tp18
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-creds
            key: access-key
          secretAccessKeySecretRef:
            name: floci-creds
            key: secret-access-key
