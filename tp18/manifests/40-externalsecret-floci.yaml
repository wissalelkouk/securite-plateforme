apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: tp18
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: floci-sm
    kind: SecretStore
  target:
    name: db-credentials
  data:
  - secretKey: password
    remoteRef:
      key: tp18/db-password
